<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Interactive Electron Orbital Visualizer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.95);
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --s-color: #ef4444; /* Red for s */
            --p-color: #eab308; /* Yellow for p */
            --d-color: #3b82f6; /* Blue for d */
        }

        body { margin: 0; overflow: hidden; background-color: var(--bg-color); font-family: 'Segoe UI', sans-serif; color: var(--text-color); }
        
        /* Layout */
        #container { display: flex; height: 100vh; width: 100vw; }
        
        /* Sidebar */
        #sidebar {
            width: 320px;
            background: var(--panel-bg);
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }

        h1 { font-size: 1.2rem; margin: 0 0 10px 0; color: var(--accent-color); }
        h2 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; border-bottom: 1px solid #334155; padding-bottom: 5px; }

        /* Controls */
        select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            color: white;
            border: 1px solid #475569;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Aufbau Diagram Layout */
        .aufbau-container {
            display: flex;
            flex-direction: column-reverse; /* Bottom up */
            gap: 10px;
            padding: 10px 0;
        }

        .shell-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .shell-label { font-weight: bold; width: 20px; font-size: 0.8rem; color: #64748b; }

        .subshell-group { display: flex; gap: 4px; }

        /* Orbital Buttons */
        .orbital-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 4px;
            background: #334155;
            color: #94a3b8;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .orbital-btn:hover { background: #475569; }
        
        .orbital-btn.active {
            box-shadow: 0 0 8px currentColor;
            color: white;
            font-weight: bold;
        }

        /* Specific Colors for Active State */
        .btn-s.active { background-color: var(--s-color); }
        .btn-p.active { background-color: var(--p-color); }
        .btn-d.active { background-color: var(--d-color); }

        /* Tooltip for granular selection */
        .sub-selector {
            display: none;
            position: absolute;
            top: 0; left: 40px;
            background: #1e293b;
            border: 1px solid #475569;
            padding: 5px;
            border-radius: 4px;
            z-index: 20;
            width: 120px;
        }

        .sub-selector.show { display: block; }
        
        .axis-check {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.75rem;
            margin: 2px 0;
            cursor: pointer;
        }

        /* Legend */
        .legend { font-size: 0.8rem; color: #94a3b8; margin-top: auto; }
        .legend-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; }

        /* 3D Area */
        #canvas-container { flex-grow: 1; position: relative; background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%); }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; }

    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="container">
    <div id="sidebar">
        <h1>Orbital Visualizer</h1>
        
        <div>
            <h2>Atom Selector</h2>
            <select id="element-select">
                <option value="0">Select an Element (1-20)...</option>
                </select>
        </div>

        <div>
            <h2>Configuration Map (Aufbau)</h2>
            <p style="font-size: 0.75rem; color:#64748b; margin-top:-5px;">Click to toggle. Hover for details.</p>
            <div class="aufbau-container" id="aufbau-grid">
                </div>
        </div>

        <div class="legend">
            <div class="legend-item"><div class="dot" style="background:var(--s-color)"></div>s-orbital (Sphere)</div>
            <div class="legend-item"><div class="dot" style="background:var(--p-color)"></div>p-orbital (Dumbbell)</div>
            <div class="legend-item"><div class="dot" style="background:var(--d-color)"></div>d-orbital (Clover)</div>
        </div>
    </div>
    
    <div id="canvas-container"></div>
</div>

<script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- Data: Electron Configurations for Elements 1-20 ---
    const elements = [
        { n: 1, sym: "H", name: "Hydrogen", conf: ["1s1"] },
        { n: 2, sym: "He", name: "Helium", conf: ["1s2"] },
        { n: 3, sym: "Li", name: "Lithium", conf: ["1s2", "2s1"] },
        { n: 4, sym: "Be", name: "Beryllium", conf: ["1s2", "2s2"] },
        { n: 5, sym: "B", name: "Boron", conf: ["1s2", "2s2", "2p1"] },
        { n: 6, sym: "C", name: "Carbon", conf: ["1s2", "2s2", "2p2"] },
        { n: 7, sym: "N", name: "Nitrogen", conf: ["1s2", "2s2", "2p3"] },
        { n: 8, sym: "O", name: "Oxygen", conf: ["1s2", "2s2", "2p4"] },
        { n: 9, sym: "F", name: "Fluorine", conf: ["1s2", "2s2", "2p5"] },
        { n: 10, sym: "Ne", name: "Neon", conf: ["1s2", "2s2", "2p6"] },
        { n: 11, sym: "Na", name: "Sodium", conf: ["1s2", "2s2", "2p6", "3s1"] },
        { n: 12, sym: "Mg", name: "Magnesium", conf: ["1s2", "2s2", "2p6", "3s2"] },
        { n: 13, sym: "Al", name: "Aluminium", conf: ["1s2", "2s2", "2p6", "3s2", "3p1"] },
        { n: 14, sym: "Si", name: "Silicon", conf: ["1s2", "2s2", "2p6", "3s2", "3p2"] },
        { n: 15, sym: "P", name: "Phosphorus", conf: ["1s2", "2s2", "2p6", "3s2", "3p3"] },
        { n: 16, sym: "S", name: "Sulfur", conf: ["1s2", "2s2", "2p6", "3s2", "3p4"] },
        { n: 17, sym: "Cl", name: "Chlorine", conf: ["1s2", "2s2", "2p6", "3s2", "3p5"] },
        { n: 18, sym: "Ar", name: "Argon", conf: ["1s2", "2s2", "2p6", "3s2", "3p6"] },
        { n: 19, sym: "K", name: "Potassium", conf: ["1s2", "2s2", "2p6", "3s2", "3p6", "4s1"] },
        { n: 20, sym: "Ca", name: "Calcium", conf: ["1s2", "2s2", "2p6", "3s2", "3p6", "4s2"] }
    ];

    // Map shells to their specific axis components
    const subshellMap = {
        's': [''],
        'p': ['x', 'y', 'z'],
        'd': ['xy', 'yz', 'xz', 'x2-y2', 'z2']
    };

    // State
    const activeOrbitals = new Set(); // Stores strings like "2px", "3dxy"

    // --- 3D Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    // Use a slight fog for depth
    scene.fog = new THREE.FogExp2(0x0f172a, 0.02);

    const camera = new THREE.PerspectiveCamera(50, container.offsetWidth / container.offsetHeight, 0.1, 100);
    camera.position.set(10, 8, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.offsetWidth, container.offsetHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0x404040, 2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 3);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xffffff, 1, 100);
    pointLight.position.set(0, 0, 0); // Inner glow
    scene.add(pointLight);

    // Helpers
    const gridHelper = new THREE.GridHelper(20, 20, 0x334155, 0x1e293b);
    scene.add(gridHelper);
    
    const axesHelper = new THREE.AxesHelper(2);
    scene.add(axesHelper);

    // Nucleus
    const nucleusGeo = new THREE.SphereGeometry(0.2, 16, 16);
    const nucleusMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1 });
    const nucleus = new THREE.Mesh(nucleusGeo, nucleusMat);
    scene.add(nucleus);

    // --- Orbital Geometry Factories ---
    // Materials
    const matS = new THREE.MeshPhysicalMaterial({ color: 0xef4444, transmission: 0.6, opacity: 0.8, transparent: true, roughness: 0.2, metalness: 0.1, side: THREE.DoubleSide });
    const matP = new THREE.MeshPhysicalMaterial({ color: 0xeab308, transmission: 0.6, opacity: 0.8, transparent: true, roughness: 0.2, metalness: 0.1, side: THREE.DoubleSide });
    const matD = new THREE.MeshPhysicalMaterial({ color: 0x3b82f6, transmission: 0.6, opacity: 0.8, transparent: true, roughness: 0.2, metalness: 0.1, side: THREE.DoubleSide });

    // Orbital Group Store
    const orbitalMeshes = {}; // Key: "1s", "2px" etc., Value: THREE.Mesh/Group

    function createOrbital(n, l, type, axis) {
        const group = new THREE.Group();
        const scale = n * 1.2; // Relative sizing based on principal quantum number

        if (type === 's') {
            const geo = new THREE.SphereGeometry(scale * 0.5, 32, 32);
            const mesh = new THREE.Mesh(geo, matS);
            group.add(mesh);
        } 
        else if (type === 'p') {
            // P orbital: two lobes (dumbbells)
            const lobeGeo = new THREE.SphereGeometry(scale * 0.4, 32, 32);
            lobeGeo.scale(0.7, 1, 0.7); // Elongate slightly
            
            const top = new THREE.Mesh(lobeGeo, matP);
            top.position.y = scale * 0.5;
            
            const bottom = new THREE.Mesh(lobeGeo, matP);
            bottom.position.y = -scale * 0.5;
            
            group.add(top, bottom);

            // Rotate based on axis
            if (axis === 'x') group.rotation.z = Math.PI / 2;
            if (axis === 'z') group.rotation.x = Math.PI / 2;
            // y is default
        } 
        else if (type === 'd') {
            // D orbital: clover leaf (4 lobes) or donut (dz2)
            const lobeSize = scale * 0.35;
            const lobeGeo = new THREE.SphereGeometry(lobeSize, 32, 32);
            lobeGeo.scale(0.6, 1.2, 0.6);

            if (axis === 'z2') {
                // Donut shape
                const top = new THREE.Mesh(lobeGeo, matD);
                top.position.y = scale * 0.5;
                const bottom = new THREE.Mesh(lobeGeo, matD);
                bottom.position.y = -scale * 0.5;
                
                const torusGeo = new THREE.TorusGeometry(lobeSize * 1.2, lobeSize * 0.4, 16, 32);
                const ring = new THREE.Mesh(torusGeo, matD);
                ring.rotation.x = Math.PI / 2;

                group.add(top, bottom, ring);
            } else {
                // Clover shapes (4 lobes)
                const lobes = [];
                for(let i=0; i<4; i++) {
                    const mesh = new THREE.Mesh(lobeGeo, matD);
                    lobes.push(mesh);
                    group.add(mesh);
                }

                // Position lobes in a generic X shape on XY plane first
                const dist = scale * 0.5;
                lobes[0].position.set(dist, dist, 0); lobes[0].rotation.z = -Math.PI/4;
                lobes[1].position.set(-dist, dist, 0); lobes[1].rotation.z = Math.PI/4;
                lobes[2].position.set(-dist, -dist, 0); lobes[2].rotation.z = -Math.PI/4;
                lobes[3].position.set(dist, -dist, 0); lobes[3].rotation.z = Math.PI/4;

                // Rotate group to match specific d-orbital orientation
                if (axis === 'xz') group.rotation.x = Math.PI / 2;
                if (axis === 'yz') group.rotation.y = Math.PI / 2;
                if (axis === 'x2-y2') { /* Default orientation corresponds to xy actually, but x2-y2 is aligned with axes */
                    group.rotation.z = 0; 
                    // Adjust positions for on-axis alignment
                    lobes[0].position.set(dist*1.2, 0, 0); lobes[0].rotation.z = Math.PI/2;
                    lobes[1].position.set(-dist*1.2, 0, 0); lobes[1].rotation.z = Math.PI/2;
                    lobes[2].position.set(0, dist*1.2, 0); lobes[2].rotation.z = 0;
                    lobes[3].position.set(0, -dist*1.2, 0); lobes[3].rotation.z = 0;
                }
            }
        }
        
        return group;
    }

    function updateScene() {
        // Clear old orbitals
        Object.values(orbitalMeshes).forEach(m => scene.remove(m));
        
        // Add active ones
        activeOrbitals.forEach(id => {
            if (!orbitalMeshes[id]) {
                // Parse ID: e.g., "2px", "3dxy", "1s"
                const n = parseInt(id[0]);
                const type = id[1];
                const axis = id.substring(2); // can be empty, x, y, z, xy, etc.
                orbitalMeshes[id] = createOrbital(n, null, type, axis);
            }
            scene.add(orbitalMeshes[id]);
        });
    }

    // --- UI Logic ---
    
    // 1. Fill Element Selector
    const select = document.getElementById('element-select');
    elements.forEach(e => {
        const opt = document.createElement('option');
        opt.value = e.n;
        opt.textContent = `${e.n}. ${e.sym} - ${e.name}`;
        select.appendChild(opt);
    });

    // 2. Build Aufbau Grid
    // We need rows for shells 1, 2, 3, 4
    const configLayout = [
        { n: 4, sub: ['s'] }, // Simplified for first 20 elements (Ca ends at 4s)
        { n: 3, sub: ['d', 'p', 's'] }, // 3d technically exists but empty for Z<=20
        { n: 2, sub: ['p', 's'] },
        { n: 1, sub: ['s'] }
    ];
    
    const grid = document.getElementById('aufbau-grid');

    configLayout.forEach(row => {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'shell-row';
        
        const label = document.createElement('div');
        label.className = 'shell-label';
        label.textContent = row.n;
        rowDiv.appendChild(label);

        // Reverse subshells to render s on left visually if desired, 
        // but Aufbau usually shows energies. 
        // Let's stick to reading left-to-right s, p, d.
        const sortedSub = ['s', 'p', 'd'].filter(x => row.sub.includes(x));

        sortedSub.forEach(type => {
            // Don't render 3d for this specific <20 element visualizer to keep UI clean,
            // but prompt asked for 3d config map capability.
            // Let's include 3d just for interactivity demo even if not filled by Ca.
            
            const btnGroup = document.createElement('div');
            btnGroup.className = 'subshell-group';
            
            // Create Main Button (e.g., "2p")
            const btn = document.createElement('button');
            btn.className = `orbital-btn btn-${type}`;
            btn.textContent = `${row.n}${type}`;
            btn.dataset.id = `${row.n}${type}`; // Broad ID
            
            // Sub-selector (tooltip)
            const subMenu = document.createElement('div');
            subMenu.className = 'sub-selector';
            
            const axes = subshellMap[type];
            axes.forEach(axis => {
                const checkRow = document.createElement('label');
                checkRow.className = 'axis-check';
                
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.dataset.fullId = `${row.n}${type}${axis}`; // e.g., 2px
                
                // Clicking checkbox toggles specific orbital
                cb.addEventListener('change', (e) => {
                    if (e.target.checked) activeOrbitals.add(e.target.dataset.fullId);
                    else activeOrbitals.delete(e.target.dataset.fullId);
                    
                    updateBtnState(btn, subMenu);
                    updateScene();
                });

                checkRow.appendChild(cb);
                checkRow.appendChild(document.createTextNode(axis || 'Total'));
                subMenu.appendChild(checkRow);
            });

            btn.appendChild(subMenu);
            
            // Interaction Logic
            btn.addEventListener('click', (e) => {
                // If clicking the button (not the checkbox inside), toggle all sub-orbitals
                if (e.target !== btn) return; 

                // Check if all are currently active
                const allIds = axes.map(a => `${row.n}${type}${a}`);
                const allActive = allIds.every(id => activeOrbitals.has(id));

                if (allActive) {
                    // Turn all off
                    allIds.forEach(id => activeOrbitals.delete(id));
                } else {
                    // Turn all on
                    allIds.forEach(id => activeOrbitals.add(id));
                }
                
                // Sync checkboxes
                updateBtnState(btn, subMenu);
                updateScene();
            });

            // Hover to show sub-selector
            btn.addEventListener('mouseenter', () => subMenu.classList.add('show'));
            btn.addEventListener('mouseleave', () => subMenu.classList.remove('show'));

            btnGroup.appendChild(btn);
            rowDiv.appendChild(btnGroup);
        });

        grid.appendChild(rowDiv);
    });

    function updateBtnState(btn, subMenu) {
        const checkboxes = subMenu.querySelectorAll('input');
        let checkedCount = 0;
        checkboxes.forEach(cb => {
            if (activeOrbitals.has(cb.dataset.fullId)) {
                cb.checked = true;
                checkedCount++;
            } else {
                cb.checked = false;
            }
        });

        if (checkedCount > 0) btn.classList.add('active');
        else btn.classList.remove('active');
    }

    // --- Element Selection Logic ---
    select.addEventListener('change', (e) => {
        const z = parseInt(e.target.value);
        if (!z) return;

        // Clear current
        activeOrbitals.clear();

        // Determine orbitals based on simple config rules for Z 1-20
        // Config: 1s, 2s, 2p, 3s, 3p, 4s
        const limits = { '1s': 2, '2s': 2, '2p': 6, '3s': 2, '3p': 6, '4s': 2 };
        let electrons = z;
        
        const subshellsOrder = ['1s', '2s', '2p', '3s', '3p', '4s'];
        
        subshellsOrder.forEach(ss => {
            if (electrons <= 0) return;
            
            const n = ss[0];
            const type = ss[1];
            const capacity = limits[ss];
            const fill = Math.min(electrons, capacity);
            
            // Logic to distribute electrons into orbitals (Hund's rule simplified)
            // We just activate the orbital geometry if there is an electron in that axis
            const axes = subshellMap[type];
            
            // For s, it's just one
            if (type === 's') {
                activeOrbitals.add(`${n}s`);
            } else {
                // For p, fill x, then y, then z
                for (let i = 0; i < Math.ceil(fill/2); i++) {
                     // /2 because each orbital holds 2 e-, but geometry exists if at least 1 e-
                     if (i < axes.length) activeOrbitals.add(`${n}${type}${axes[i]}`);
                }
            }
            
            electrons -= fill;
        });

        // Update UI
        document.querySelectorAll('.orbital-btn').forEach(btn => {
            const subMenu = btn.querySelector('.sub-selector');
            updateBtnState(btn, subMenu);
        });
        
        updateScene();
    });


    // --- Animation Loop ---
    function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
    }

    // Handle Resize
    window.addEventListener('resize', () => {
        camera.aspect = document.getElementById('canvas-container').offsetWidth / document.getElementById('canvas-container').offsetHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(document.getElementById('canvas-container').offsetWidth, document.getElementById('canvas-container').offsetHeight);
    });

    animate();

</script>
</body>
</html>
